services:
  env:
    build:
      args:
        HOST_UID: "${HOST_UID}"
        HOST_GID: "${HOST_GID}"
        WHO: "${WHO}"
        binutils_version: "${binutils_version}"
        gcc_version: "${gcc_version}"
      context: "."
      dockerfile: "env/Dockerfile"
    volumes:
      - './env/cross:/cross'
      - '..:/chuckles'
    # environment:
    working_dir: /chuckles


